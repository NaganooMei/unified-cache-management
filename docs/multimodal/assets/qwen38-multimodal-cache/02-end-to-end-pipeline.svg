<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3.8多模态请求端到端执行流程</title>
  <desc id="desc">文本走Tokenizer和Text Embedding分支，图片与视频走MM Processor和Vision Encoder分支，两路在原占位位置合并后进入Language Model。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:'Segoe Print','Comic Sans MS','KaiTi',sans-serif;fill:#1f2937;font-weight:600}.body{font-family:'Microsoft YaHei','Segoe UI',sans-serif;font-weight:400}.title{font-size:34px}.sub{font-size:17px;fill:#64748b}.label{font-size:19px}.small{font-size:14px;fill:#64748b}.rough{fill:#fffdf8;stroke:#334155;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.echo{fill:none;stroke:#334155;stroke-width:1.2;opacity:.18}.blue{stroke:#4c6ef5}.green{stroke:#2f9e44}.orange{stroke:#f08c00}.purple{stroke:#7950f2}.bluefill{fill:#edf2ff}.greenfill{fill:#ebfbee}.orangefill{fill:#fff4e6}.purplefill{fill:#f3f0ff}.line{fill:none;stroke:#334155;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1440" height="760" fill="#fffdf8"/>
  <text x="58" y="58" class="title">从原始请求到 Language Model</text>
  <text x="60" y="88" class="sub body">文本分支与媒体分支分别处理，最后按占位位置合并</text>
  <path d="M60 99 C214 94 372 103 525 97" class="line purple" opacity=".42"/>

  <path d="M52 299 Q55 285 70 288 L228 285 Q243 289 240 305 L243 425 Q240 440 226 437 L70 441 Q54 437 58 422 Z" class="rough"/>
  <path d="M60 296 Q67 288 78 290 L230 288" class="echo"/>
  <text x="149" y="335" text-anchor="middle" class="label">OpenAI Chat 请求</text>
  <text x="149" y="368" text-anchor="middle" class="body" font-size="15">Text + Image + Video</text>
  <text x="149" y="399" text-anchor="middle" class="small body">保持内容顺序</text>

  <path d="M243 360 C279 337 287 253 318 231" class="line blue" marker-end="url(#arrow)"/>
  <path d="M243 380 C278 405 287 505 318 527" class="line green" marker-end="url(#arrow)"/>

  <text x="312" y="148" class="label blue">文本分支 · CPU / NPU</text>
  <path d="M310 158 C441 153 569 161 700 156" class="line blue" opacity=".35"/>
  <path d="M324 188 Q327 176 341 179 L520 176 Q535 180 532 195 L535 270 Q531 284 518 281 L341 285 Q326 281 329 267 Z" class="rough blue bluefill"/>
  <text x="430" y="220" text-anchor="middle" class="label">Tokenizer</text><text x="430" y="250" text-anchor="middle" class="body" font-size="15">text → token_ids [Ntext]</text>

  <path d="M535 230 C565 227 590 233 618 230" class="line" marker-end="url(#arrow)"/>
  <path d="M626 188 Q629 176 643 179 L822 176 Q837 180 834 195 L837 270 Q833 284 820 281 L643 285 Q628 281 631 267 Z" class="rough blue bluefill"/>
  <text x="732" y="220" text-anchor="middle" class="label">Text Embedding</text><text x="732" y="250" text-anchor="middle" class="body" font-size="15">[Ntext, 5120]</text>

  <text x="312" y="445" class="label green">图片 / 视频分支 · CPU → NPU</text>
  <path d="M310 455 C475 450 639 459 803 453" class="line green" opacity=".35"/>
  <path d="M324 484 Q327 472 341 475 L520 472 Q535 476 532 491 L535 586 Q531 600 518 597 L341 601 Q326 597 329 583 Z" class="rough green greenfill"/>
  <text x="430" y="516" text-anchor="middle" class="label">MM Processor</text><text x="430" y="546" text-anchor="middle" class="body" font-size="15">Decode · Resize · Patchify</text><text x="430" y="574" text-anchor="middle" class="body" font-size="15">pixel_values [Npatch, 1536]</text>

  <path d="M535 537 C565 534 590 540 618 537" class="line" marker-end="url(#arrow)"/>
  <path d="M626 484 Q629 472 643 475 L822 472 Q837 476 834 491 L837 586 Q833 600 820 597 L643 601 Q628 597 631 583 Z" class="rough green greenfill"/>
  <text x="732" y="516" text-anchor="middle" class="label">Vision Encoder</text><text x="732" y="546" text-anchor="middle" class="body" font-size="14">ViT output [Npatch,1152]</text><text x="732" y="574" text-anchor="middle" class="body" font-size="14">Merger output [Nvis,5120]</text>

  <path d="M837 230 C885 232 894 322 936 347" class="line blue" marker-end="url(#arrow)"/>
  <path d="M837 537 C885 534 894 445 936 419" class="line green" marker-end="url(#arrow)"/>
  <path d="M944 325 Q947 311 962 314 L1124 311 Q1139 315 1136 331 L1139 447 Q1136 462 1122 459 L962 463 Q946 459 950 444 Z" class="rough orange orangefill"/>
  <text x="1042" y="360" text-anchor="middle" class="label">Embedding 替换</text>
  <text x="1042" y="390" text-anchor="middle" class="body" font-size="15">视觉结果回填媒体占位区</text>
  <text x="1042" y="420" text-anchor="middle" class="body" font-size="15">merged [S, 5120]</text>

  <path d="M1139 386 C1155 383 1170 390 1185 386" class="line" marker-end="url(#arrow)"/>
  <path d="M1193 319 Q1196 305 1211 308 L1370 305 Q1385 309 1382 325 L1385 447 Q1382 462 1368 459 L1211 463 Q1195 459 1199 444 Z" class="rough purple purplefill"/>
  <text x="1290" y="354" text-anchor="middle" class="label">Language Model</text><text x="1290" y="386" text-anchor="middle" class="body" font-size="15">Prefill</text><text x="1290" y="416" text-anchor="middle" class="body" font-size="15">Decode</text>

  <path d="M430 603 C429 639 551 650 642 651" class="line green"/>
  <text x="650" y="660" class="small body">CPU 到 NPU 的边界</text>
  <path d="M650 671 C744 675 840 664 934 670" class="line" stroke-dasharray="8 7" opacity=".45"/>
  <text x="60" y="720" class="small body">S = Ntext + ΣNvis + Nspecial；Nspecial 表示媒体边界与控制 token</text>
</svg>
