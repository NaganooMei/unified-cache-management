<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">文本图片视频Tensor维度瀑布图</title>
  <desc id="desc">文本经过Tokenizer与Embedding，图片和视频经过Patchify、Vision Transformer及Patch Merger，最终所有模态都变为宽度5120的Embedding。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      text { font-family: Arial, 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .head { font-size: 20px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .shape { font-size: 15px; fill: #334155; }
      .note { font-size: 14px; fill: #64748b; }
      .box { filter: url(#shadow); stroke-width: 2; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1440" height="1080" fill="#f8fafc"/>
  <text x="72" y="58" class="title">每一步的 Tensor 怎样变化</text>
  <text x="72" y="92" class="subtitle">示例数值用于把量级画清楚；真实尺寸会随动态Resize、抽帧和文本长度变化</text>

  <g transform="translate(54,132)">
    <rect width="305" height="760" rx="22" fill="#eff6ff"/>
    <text x="152" y="42" text-anchor="middle" class="head">文本</text>
    <g transform="translate(32,78)">
      <rect class="box" width="241" height="78" rx="14" fill="#ffffff" stroke="#2563eb"/>
      <text x="120" y="31" text-anchor="middle" class="label">原始文本</text>
      <text x="120" y="56" text-anchor="middle" class="shape">Unicode字符串</text>
    </g>
    <path class="flow" d="M152 156 V198"/>
    <g transform="translate(32,208)">
      <rect class="box" width="241" height="78" rx="14" fill="#dbeafe" stroke="#2563eb"/>
      <text x="120" y="31" text-anchor="middle" class="label">Tokenizer</text>
      <text x="120" y="56" text-anchor="middle" class="shape">token_ids [Ntext]</text>
    </g>
    <path class="flow" d="M152 286 V328"/>
    <g transform="translate(32,338)">
      <rect class="box" width="241" height="78" rx="14" fill="#dbeafe" stroke="#2563eb"/>
      <text x="120" y="31" text-anchor="middle" class="label">Text Embedding</text>
      <text x="120" y="56" text-anchor="middle" class="shape">[Ntext, 5120]</text>
    </g>
    <path class="flow" d="M152 416 V558"/>
    <g transform="translate(32,568)">
      <rect class="box" width="241" height="106" rx="14" fill="#bfdbfe" stroke="#1d4ed8"/>
      <text x="120" y="32" text-anchor="middle" class="label">进入统一序列</text>
      <text x="120" y="61" text-anchor="middle" class="shape">宽度已是5120</text>
      <text x="120" y="85" text-anchor="middle" class="note">等待视觉位置替换</text>
    </g>
  </g>

  <g transform="translate(379,132)">
    <rect width="305" height="760" rx="22" fill="#f0fdfa"/>
    <text x="152" y="42" text-anchor="middle" class="head">图片 1 · 4K</text>
    <g transform="translate(32,78)">
      <rect class="box" width="241" height="78" rx="14" fill="#ffffff" stroke="#0f766e"/>
      <text x="120" y="31" text-anchor="middle" class="label">原始 RGB</text>
      <text x="120" y="56" text-anchor="middle" class="shape">[4096,4096,3]</text>
    </g>
    <path class="flow" d="M152 156 V182"/>
    <g transform="translate(32,192)">
      <rect class="box" width="241" height="96" rx="14" fill="#ccfbf1" stroke="#0f766e"/>
      <text x="120" y="29" text-anchor="middle" class="label">Patchify · 2×16×16×RGB</text>
      <text x="120" y="57" text-anchor="middle" class="shape">grid [1,256,256]</text>
      <text x="120" y="80" text-anchor="middle" class="shape">[65536,1536]</text>
    </g>
    <path class="flow" d="M152 288 V316"/>
    <g transform="translate(32,326)">
      <rect class="box" width="241" height="82" rx="14" fill="#99f6e4" stroke="#0f766e"/>
      <text x="120" y="31" text-anchor="middle" class="label">Vision Transformer</text>
      <text x="120" y="59" text-anchor="middle" class="shape">[65536,1152]</text>
    </g>
    <path class="flow" d="M152 408 V436"/>
    <g transform="translate(32,446)">
      <rect class="box" width="241" height="96" rx="14" fill="#5eead4" stroke="#0f766e"/>
      <text x="120" y="29" text-anchor="middle" class="label">2×2 Patch Merger</text>
      <text x="120" y="57" text-anchor="middle" class="shape">token数 ÷ 4</text>
      <text x="120" y="80" text-anchor="middle" class="shape">[16384,5120]</text>
    </g>
    <path class="flow" d="M152 542 V558"/>
    <g transform="translate(32,568)">
      <rect class="box" width="241" height="106" rx="14" fill="#2dd4bf" fill-opacity="0.4" stroke="#0f766e"/>
      <text x="120" y="32" text-anchor="middle" class="label">视觉 Embedding</text>
      <text x="120" y="61" text-anchor="middle" class="shape">Nvis₁ = 16384</text>
      <text x="120" y="85" text-anchor="middle" class="note">宽度5120</text>
    </g>
  </g>

  <g transform="translate(704,132)">
    <rect width="305" height="760" rx="22" fill="#fff7ed"/>
    <text x="152" y="42" text-anchor="middle" class="head">图片 2 · 2K</text>
    <g transform="translate(32,78)">
      <rect class="box" width="241" height="78" rx="14" fill="#ffffff" stroke="#ea580c"/>
      <text x="120" y="31" text-anchor="middle" class="label">原始 RGB</text>
      <text x="120" y="56" text-anchor="middle" class="shape">[2048,2048,3]</text>
    </g>
    <path class="flow" d="M152 156 V182"/>
    <g transform="translate(32,192)">
      <rect class="box" width="241" height="96" rx="14" fill="#ffedd5" stroke="#ea580c"/>
      <text x="120" y="29" text-anchor="middle" class="label">Patchify · 2×16×16×RGB</text>
      <text x="120" y="57" text-anchor="middle" class="shape">grid [1,128,128]</text>
      <text x="120" y="80" text-anchor="middle" class="shape">[16384,1536]</text>
    </g>
    <path class="flow" d="M152 288 V316"/>
    <g transform="translate(32,326)">
      <rect class="box" width="241" height="82" rx="14" fill="#fed7aa" stroke="#ea580c"/>
      <text x="120" y="31" text-anchor="middle" class="label">Vision Transformer</text>
      <text x="120" y="59" text-anchor="middle" class="shape">[16384,1152]</text>
    </g>
    <path class="flow" d="M152 408 V436"/>
    <g transform="translate(32,446)">
      <rect class="box" width="241" height="96" rx="14" fill="#fdba74" stroke="#ea580c"/>
      <text x="120" y="29" text-anchor="middle" class="label">2×2 Patch Merger</text>
      <text x="120" y="57" text-anchor="middle" class="shape">token数 ÷ 4</text>
      <text x="120" y="80" text-anchor="middle" class="shape">[4096,5120]</text>
    </g>
    <path class="flow" d="M152 542 V558"/>
    <g transform="translate(32,568)">
      <rect class="box" width="241" height="106" rx="14" fill="#fb923c" fill-opacity="0.35" stroke="#ea580c"/>
      <text x="120" y="32" text-anchor="middle" class="label">视觉 Embedding</text>
      <text x="120" y="61" text-anchor="middle" class="shape">Nvis₂ = 4096</text>
      <text x="120" y="85" text-anchor="middle" class="note">宽度5120</text>
    </g>
  </g>

  <g transform="translate(1029,132)">
    <rect width="357" height="760" rx="22" fill="#f5f3ff"/>
    <text x="178" y="42" text-anchor="middle" class="head">视频 · 8帧 / 1024×1024</text>
    <g transform="translate(42,78)">
      <rect class="box" width="273" height="78" rx="14" fill="#ffffff" stroke="#7c3aed"/>
      <text x="136" y="31" text-anchor="middle" class="label">抽帧后 RGB</text>
      <text x="136" y="56" text-anchor="middle" class="shape">[8,1024,1024,3]</text>
    </g>
    <path class="flow" d="M178 156 V182"/>
    <g transform="translate(42,192)">
      <rect class="box" width="273" height="96" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
      <text x="136" y="29" text-anchor="middle" class="label">时空 Patchify</text>
      <text x="136" y="57" text-anchor="middle" class="shape">grid [4,64,64]</text>
      <text x="136" y="80" text-anchor="middle" class="shape">[16384,1536]</text>
    </g>
    <path class="flow" d="M178 288 V316"/>
    <g transform="translate(42,326)">
      <rect class="box" width="273" height="82" rx="14" fill="#ddd6fe" stroke="#7c3aed"/>
      <text x="136" y="31" text-anchor="middle" class="label">Vision Transformer</text>
      <text x="136" y="59" text-anchor="middle" class="shape">[16384,1152]</text>
    </g>
    <path class="flow" d="M178 408 V436"/>
    <g transform="translate(42,446)">
      <rect class="box" width="273" height="96" rx="14" fill="#c4b5fd" stroke="#7c3aed"/>
      <text x="136" y="29" text-anchor="middle" class="label">2×2 Patch Merger</text>
      <text x="136" y="57" text-anchor="middle" class="shape">空间token数 ÷ 4</text>
      <text x="136" y="80" text-anchor="middle" class="shape">[4096,5120]</text>
    </g>
    <path class="flow" d="M178 542 V558"/>
    <g transform="translate(42,568)">
      <rect class="box" width="273" height="106" rx="14" fill="#a78bfa" fill-opacity="0.35" stroke="#7c3aed"/>
      <text x="136" y="32" text-anchor="middle" class="label">视觉 Embedding</text>
      <text x="136" y="61" text-anchor="middle" class="shape">Nvisᵥ = 4096</text>
      <text x="136" y="85" text-anchor="middle" class="note">宽度5120</text>
    </g>
  </g>

  <path d="M206 806 C206 956 720 938 720 984" class="flow"/>
  <path d="M531 806 C531 930 720 938 720 984" class="flow"/>
  <path d="M856 806 C856 930 720 938 720 984" class="flow"/>
  <path d="M1207 806 C1207 956 720 938 720 984" class="flow"/>
  <rect x="448" y="992" width="544" height="60" rx="16" fill="#ffffff" stroke="#334155" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="720" y="1020" text-anchor="middle" class="label">统一 Embedding 序列 [S, 5120]</text>
  <text x="720" y="1042" text-anchor="middle" class="note">序列长度不同，但最后一维必须一致</text>
</svg>
