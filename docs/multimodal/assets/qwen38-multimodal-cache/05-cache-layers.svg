<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3.8多模态三级缓存与可选外部EC</title>
  <desc id="desc">沿推理链路展示MM Processor Cache、本地Encoder Cache、KV Prefix Cache与可选ECExampleConnector的缓存对象、位置、容量和命中依据。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:'Segoe Print','Comic Sans MS','KaiTi',sans-serif;fill:#1f2937;font-weight:600}.body{font-family:'Microsoft YaHei','Segoe UI',sans-serif;font-weight:400}.title{font-size:34px}.sub{font-size:17px;fill:#64748b}.head{font-size:22px}.label{font-size:18px}.small{font-size:14px;fill:#64748b}.rough{fill:#fffdf8;stroke:#334155;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.echo{fill:none;stroke:#334155;stroke-width:1.2;opacity:.18}.blue{stroke:#4c6ef5}.green{stroke:#2f9e44}.orange{stroke:#f08c00}.purple{stroke:#7950f2}.bluefill{fill:#edf2ff}.greenfill{fill:#ebfbee}.orangefill{fill:#fff4e6}.purplefill{fill:#f3f0ff}.line{fill:none;stroke:#334155;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:10 8}
    </style>
  </defs>
  <rect width="1440" height="1000" fill="#fffdf8"/>
  <text x="58" y="58" class="title">3 个本地缓存 = 3 个不同阶段的复用点</text>
  <text x="60" y="88" class="sub body">相同标识可以贯穿链路，但缓存对象不同</text>
  <path d="M61 99 C244 94 427 103 611 97" class="line blue" opacity=".42"/>

  <path d="M54 150 Q57 137 71 140 L254 137 Q269 141 266 156 L269 239 Q266 253 252 250 L71 254 Q56 250 59 236 Z" class="rough"/>
  <text x="161" y="183" text-anchor="middle" class="label">原始媒体</text><text x="161" y="215" text-anchor="middle" class="small body">图片 / 视频字节</text>
  <path d="M269 195 C299 192 324 198 352 195" class="line" marker-end="url(#arrow)"/>
  <path d="M360 150 Q363 137 377 140 L560 137 Q575 141 572 156 L575 239 Q572 253 558 250 L377 254 Q362 250 365 236 Z" class="rough blue bluefill"/>
  <text x="467" y="183" text-anchor="middle" class="label">MM Processor</text><text x="467" y="215" text-anchor="middle" class="small body">Decode · Resize · Patchify</text>
  <path d="M575 195 C605 192 630 198 658 195" class="line" marker-end="url(#arrow)"/>
  <path d="M666 150 Q669 137 683 140 L866 137 Q881 141 878 156 L881 239 Q878 253 864 250 L683 254 Q668 250 671 236 Z" class="rough green greenfill"/>
  <text x="773" y="183" text-anchor="middle" class="label">Vision Encoder</text><text x="773" y="215" text-anchor="middle" class="small body">ViT · Patch Merger</text>
  <path d="M881 195 C911 192 936 198 964 195" class="line" marker-end="url(#arrow)"/>
  <path d="M972 150 Q975 137 989 140 L1270 137 Q1285 141 1282 156 L1285 239 Q1282 253 1268 250 L989 254 Q974 250 977 236 Z" class="rough purple purplefill"/>
  <text x="1129" y="183" text-anchor="middle" class="label">Language Model</text><text x="1129" y="215" text-anchor="middle" class="small body">Prefill · Decode</text>

  <path d="M467 254 C465 281 469 300 467 325" class="line blue" marker-end="url(#arrow)"/><path d="M773 254 C771 281 775 300 773 325" class="line green" marker-end="url(#arrow)"/><path d="M1129 254 C1127 281 1131 300 1129 325" class="line purple" marker-end="url(#arrow)"/>

  <path d="M58 345 Q61 329 78 333 L485 328 Q502 333 498 351 L503 643 Q499 661 482 657 L78 663 Q60 659 64 640 Z" class="rough blue bluefill"/>
  <path d="M65 342 Q74 332 87 335 L487 331" class="echo blue"/>
  <text x="280" y="380" text-anchor="middle" class="head">① MM Processor Cache</text>
  <text x="92" y="425" class="label">位置</text><text x="174" y="425" class="body" font-size="16">CPU 进程内 LRU</text>
  <text x="92" y="465" class="label">默认容量</text><text x="212" y="465" class="body" font-size="16">每个 API / Engine 进程 4 GiB</text>
  <text x="92" y="505" class="label">缓存对象</text><text x="212" y="505" class="body" font-size="16">pixel_values、grid_thw、Prompt 更新</text>
  <text x="92" y="545" class="label">命中</text><text x="174" y="545" class="body" font-size="16">LRU 中存在 mm_hash</text>
  <text x="92" y="592" class="label blue">→ 跳过媒体预处理</text>
  <path d="M92 604 C213 598 337 609 459 602" class="line blue" opacity=".5"/>
  <text x="92" y="635" class="small body">4K 核心 tensor：约 384 MiB（FP32）</text>

  <path d="M520 345 Q523 329 540 333 L947 328 Q964 333 960 351 L965 643 Q961 661 944 657 L540 663 Q522 659 526 640 Z" class="rough green greenfill"/>
  <path d="M527 342 Q536 332 549 335 L949 331" class="echo green"/>
  <text x="742" y="380" text-anchor="middle" class="head">② 本地 Encoder Cache</text>
  <text x="554" y="425" class="label">位置</text><text x="636" y="425" class="body" font-size="16">NPU HBM</text>
  <text x="554" y="465" class="label">容量</text><text x="636" y="465" class="body" font-size="15">max(MNBT, max_tokens_per_mm_item)</text>
  <text x="554" y="505" class="label">缓存对象</text><text x="674" y="505" class="body" font-size="16">visual embeddings [Nvis,5120]</text>
  <text x="554" y="545" class="label">命中</text><text x="636" y="545" class="body" font-size="16">本地管理器存在 identifier</text>
  <text x="554" y="592" class="label green">→ 跳过 Vision Encoder</text>
  <path d="M554 604 C675 598 799 609 921 602" class="line green" opacity=".5"/>
  <text x="554" y="635" class="small body">4K Embedding：约 160 MiB / rank（BF16）</text>

  <path d="M982 345 Q985 329 1002 333 L1365 328 Q1382 333 1378 351 L1383 643 Q1379 661 1362 657 L1002 663 Q984 659 988 640 Z" class="rough purple purplefill"/>
  <path d="M989 342 Q998 332 1011 335 L1367 331" class="echo purple"/>
  <text x="1182" y="380" text-anchor="middle" class="head">③ KV / Prefix Cache</text>
  <text x="1016" y="425" class="label">位置</text><text x="1098" y="425" class="body" font-size="16">NPU HBM Cache Blocks</text>
  <text x="1016" y="465" class="label">容量</text><text x="1098" y="465" class="body" font-size="16">由可用 HBM 与 Block 数决定</text>
  <text x="1016" y="505" class="label">缓存对象</text><text x="1136" y="505" class="body" font-size="16">KV / GDN state</text>
  <text x="1016" y="545" class="label">命中</text><text x="1098" y="545" class="body" font-size="16">前缀 Block Hash 匹配</text>
  <text x="1016" y="592" class="label purple">→ 跳过命中段 Prefill</text>
  <path d="M1016 604 C1120 598 1225 609 1335 602" class="line purple" opacity=".5"/>

  <path d="M742 664 C741 706 718 724 696 746" class="line orange dash" marker-end="url(#orangeArrow)"/>
  <path d="M410 770 Q413 754 430 758 L1006 752 Q1024 757 1019 776 L1024 911 Q1020 929 1003 925 L430 931 Q412 927 416 908 Z" class="rough orange orangefill dash"/>
  <text x="716" y="805" text-anchor="middle" class="head">可选外部 EC · ECExampleConnector</text>
  <text x="450" y="847" class="body" font-size="16">默认关闭　·　默认目录 /tmp　·　无固定容量和自动淘汰</text>
  <text x="450" y="882" class="body" font-size="16">命中：/tmp/&lt;mm_hash&gt;/encoder_cache.safetensors 存在</text>
  <text x="450" y="915" class="body" font-size="16">命中后加载回本地 HBM，再跳过 Vision Encoder</text>
  <text x="1060" y="826" class="label orange">外部副本</text><text x="1060" y="857" class="small body">不是第 4 个本地缓存</text>
  <path d="M1052 866 C1029 867 1017 861 1003 854" class="line orange" marker-end="url(#orangeArrow)"/>
  <text x="60" y="970" class="small body">MNBT = max_num_batched_tokens；外部文件大小约等于 Encoder 输出 tensor 大小，另有文件头与文件系统开销。</text>
</svg>
