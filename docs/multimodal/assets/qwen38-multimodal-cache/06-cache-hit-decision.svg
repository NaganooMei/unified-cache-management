<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img" aria-labelledby="title desc">
  <title id="title">重复多模态请求的缓存命中决策</title>
  <desc id="desc">重复请求先判断MM Processor Cache，再计算Prefix Cache未覆盖区间；只有未覆盖区间包含媒体时才检查本地Encoder Cache与可选外部EC。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:'Segoe Print','Comic Sans MS','KaiTi',sans-serif;fill:#1f2937;font-weight:600}.body{font-family:'Microsoft YaHei','Segoe UI',sans-serif;font-weight:400}.title{font-size:34px}.sub{font-size:17px;fill:#64748b}.label{font-size:18px}.small{font-size:14px;fill:#64748b}.rough{fill:#fffdf8;stroke:#334155;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.blue{stroke:#4c6ef5}.green{stroke:#2f9e44}.orange{stroke:#f08c00}.purple{stroke:#7950f2}.red{stroke:#e03131}.bluefill{fill:#edf2ff}.greenfill{fill:#ebfbee}.orangefill{fill:#fff4e6}.purplefill{fill:#f3f0ff}.redfill{fill:#fff5f5}.line{fill:none;stroke:#334155;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.hit{fill:none;stroke:#2f9e44;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.miss{fill:none;stroke:#e03131;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:9 7}
    </style>
  </defs>
  <rect width="1440" height="1280" fill="#fffdf8"/>
  <text x="58" y="58" class="title">重复请求：三个缓存分别判断</text>
  <text x="60" y="88" class="sub body">Prefix 命中不等于 MM Cache 或 Encoder Cache 命中</text>
  <path d="M61 99 C214 94 368 103 523 97" class="line purple" opacity=".42"/>

  <path d="M530 125 Q533 112 548 115 L890 112 Q906 116 903 132 L906 196 Q903 211 888 208 L548 212 Q532 208 536 193 Z" class="rough"/>
  <text x="718" y="163" text-anchor="middle" class="label">第二次收到相同请求</text>
  <path d="M718 212 C716 232 720 244 718 260" class="line" marker-end="url(#arrow)"/>

  <path d="M718 270 L932 347 L718 424 L504 347 Z" class="rough blue bluefill"/>
  <text x="718" y="338" text-anchor="middle" class="label">MM Processor Cache 命中？</text>
  <text x="718" y="367" text-anchor="middle" class="small body">LRU 中存在 mm_hash</text>
  <path d="M504 347 C437 345 382 349 328 347 V445" class="hit" marker-end="url(#greenArrow)"/>
  <text x="405" y="330" class="label green">是</text>
  <path d="M932 347 C999 345 1054 349 1108 347 V445" class="miss" marker-end="url(#redArrow)"/>
  <text x="1016" y="330" class="label red">否</text>
  <path d="M145 462 Q148 449 163 452 L493 449 Q509 453 506 469 L509 545 Q506 560 491 557 L163 561 Q147 557 151 542 Z" class="rough green greenfill"/>
  <text x="327" y="496" text-anchor="middle" class="label">复用 pixel_values / grid_thw</text><text x="327" y="528" text-anchor="middle" class="small body">跳过媒体预处理</text>
  <path d="M928 462 Q931 449 946 452 L1276 449 Q1292 453 1289 469 L1292 545 Q1289 560 1274 557 L946 561 Q930 557 934 542 Z" class="rough red redfill"/>
  <text x="1110" y="496" text-anchor="middle" class="label">重新执行媒体预处理</text><text x="1110" y="528" text-anchor="middle" class="small body">结果写入当前进程 LRU</text>
  <path d="M327 562 C328 591 601 579 649 612" class="line" marker-end="url(#arrow)"/><path d="M1110 562 C1110 591 835 579 787 612" class="line" marker-end="url(#arrow)"/>

  <path d="M718 620 L932 697 L718 774 L504 697 Z" class="rough purple purplefill"/>
  <text x="718" y="685" text-anchor="middle" class="label">Prefix Cache 覆盖到哪里？</text>
  <text x="718" y="714" text-anchor="middle" class="small body">得到未覆盖的 Language 计算区间</text>
  <path d="M718 774 C716 794 720 806 718 822" class="line" marker-end="url(#arrow)"/>

  <path d="M718 830 L932 907 L718 984 L504 907 Z" class="rough orange orangefill"/>
  <text x="718" y="895" text-anchor="middle" class="label">未覆盖区间包含媒体占位区？</text>
  <text x="718" y="924" text-anchor="middle" class="small body">只检查需要重新计算的视觉 span</text>
  <path d="M504 907 C425 904 359 910 296 907 V1020" class="hit" marker-end="url(#greenArrow)"/>
  <text x="405" y="890" class="label green">否</text>
  <path d="M932 907 C999 904 1048 910 1092 907 V1010" class="line" marker-end="url(#arrow)"/>
  <text x="1016" y="890" class="label">是</text>
  <path d="M95 1035 Q98 1022 113 1025 L477 1022 Q493 1026 490 1042 L493 1122 Q490 1137 475 1134 L113 1138 Q97 1134 101 1119 Z" class="rough green greenfill"/>
  <text x="294" y="1070" text-anchor="middle" class="label">不运行 Vision Encoder</text><text x="294" y="1102" text-anchor="middle" class="small body">直接继续未覆盖区间的 Language Prefill</text>

  <path d="M1092 1020 L1270 1082 L1092 1144 L914 1082 Z" class="rough green greenfill"/>
  <text x="1092" y="1073" text-anchor="middle" class="label">本地 Encoder Cache 命中？</text>
  <text x="1092" y="1102" text-anchor="middle" class="small body">存在 identifier</text>
  <path d="M914 1082 C853 1080 810 1085 770 1082 V1183" class="hit" marker-end="url(#greenArrow)"/>
  <text x="836" y="1065" class="label green">是</text>
  <path d="M1270 1082 C1326 1080 1358 1085 1380 1082 V1183" class="miss" marker-end="url(#redArrow)"/>
  <text x="1318" y="1065" class="label red">否</text>
  <path d="M575 1195 Q578 1182 593 1185 L947 1182 Q963 1186 960 1202 L963 1250 Q960 1265 945 1262 L593 1266 Q577 1262 581 1247 Z" class="rough green greenfill"/>
  <text x="769" y="1227" text-anchor="middle" class="label">复用 HBM 中的 visual embeddings</text><text x="769" y="1253" text-anchor="middle" class="small body">跳过 Vision Encoder</text>

  <path d="M1010 1188 Q1013 1175 1028 1178 L1378 1175 Q1394 1179 1391 1195 L1394 1250 Q1391 1265 1376 1262 L1028 1266 Q1012 1262 1016 1247 Z" class="rough orange orangefill dash"/>
  <text x="1202" y="1209" text-anchor="middle" class="label">外部 EC 文件存在？</text>
  <text x="1202" y="1236" text-anchor="middle" class="small body">是：加载回 HBM　·　否：运行 Vision Encoder</text>
  <text x="1202" y="1258" text-anchor="middle" class="small body">未配置 EC 等同于外部 miss</text>
</svg>
