<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">一个文本、多图、视频混合请求的原始顺序</title>
  <desc id="desc">请求由系统提示词、文本A、4096乘4096图片、文本B、2048乘2048图片、文本C、八帧视频和最终问题依次组成，模型输入保持这个顺序。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: Arial, 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .step { font-size: 15px; font-weight: 700; fill: #64748b; }
      .label { font-size: 19px; font-weight: 700; }
      .detail { font-size: 15px; fill: #475569; }
      .small { font-size: 14px; fill: #64748b; }
      .box { filter: url(#shadow); stroke-width: 2; }
    </style>
  </defs>

  <rect width="1440" height="720" fill="#f8fafc"/>
  <text x="72" y="64" class="title">示例请求：文本、两张图片和一段视频交错出现</text>
  <text x="72" y="98" class="subtitle">顺序由消息内容决定；图片和视频不会统一挪到文本之前或之后</text>

  <line x1="96" y1="304" x2="1344" y2="304" stroke="#cbd5e1" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(68,150)">
    <text x="80" y="-18" text-anchor="middle" class="step">01</text>
    <rect class="box" width="160" height="124" rx="18" fill="#e0f2fe" stroke="#2563eb"/>
    <text x="80" y="48" text-anchor="middle" class="label">系统提示词</text>
    <text x="80" y="78" text-anchor="middle" class="detail">角色与规则</text>
  </g>

  <g transform="translate(250,150)">
    <text x="70" y="-18" text-anchor="middle" class="step">02</text>
    <rect class="box" width="140" height="124" rx="18" fill="#dbeafe" stroke="#2563eb"/>
    <text x="70" y="48" text-anchor="middle" class="label">文本 A</text>
    <text x="70" y="78" text-anchor="middle" class="detail">先看第一张图</text>
  </g>

  <g transform="translate(412,130)">
    <text x="92" y="-18" text-anchor="middle" class="step">03</text>
    <rect class="box" width="184" height="164" rx="18" fill="#ccfbf1" stroke="#0f766e"/>
    <rect x="25" y="24" width="134" height="76" rx="10" fill="#5eead4" opacity="0.65"/>
    <path d="M36 88 L72 50 L96 74 L119 52 L149 88 Z" fill="#0f766e" opacity="0.75"/>
    <circle cx="126" cy="46" r="10" fill="#fef3c7"/>
    <text x="92" y="126" text-anchor="middle" class="label">图片 1</text>
    <text x="92" y="151" text-anchor="middle" class="detail">4096 × 4096</text>
  </g>

  <g transform="translate(618,150)">
    <text x="70" y="-18" text-anchor="middle" class="step">04</text>
    <rect class="box" width="140" height="124" rx="18" fill="#dbeafe" stroke="#2563eb"/>
    <text x="70" y="48" text-anchor="middle" class="label">文本 B</text>
    <text x="70" y="78" text-anchor="middle" class="detail">再比较第二张</text>
  </g>

  <g transform="translate(780,130)">
    <text x="92" y="-18" text-anchor="middle" class="step">05</text>
    <rect class="box" width="184" height="164" rx="18" fill="#ffedd5" stroke="#ea580c"/>
    <rect x="25" y="24" width="134" height="76" rx="10" fill="#fdba74" opacity="0.7"/>
    <path d="M36 88 L70 58 L94 78 L119 48 L149 88 Z" fill="#c2410c" opacity="0.72"/>
    <circle cx="53" cy="45" r="10" fill="#fff7ed"/>
    <text x="92" y="126" text-anchor="middle" class="label">图片 2</text>
    <text x="92" y="151" text-anchor="middle" class="detail">2048 × 2048</text>
  </g>

  <g transform="translate(986,150)">
    <text x="70" y="-18" text-anchor="middle" class="step">06</text>
    <rect class="box" width="140" height="124" rx="18" fill="#dbeafe" stroke="#2563eb"/>
    <text x="70" y="48" text-anchor="middle" class="label">文本 C</text>
    <text x="70" y="78" text-anchor="middle" class="detail">最后观察视频</text>
  </g>

  <g transform="translate(1148,130)">
    <text x="92" y="-18" text-anchor="middle" class="step">07</text>
    <rect class="box" width="184" height="164" rx="18" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="27" y="27" width="130" height="74" rx="10" fill="#c4b5fd"/>
    <path d="M79 48 L116 64 L79 82 Z" fill="#6d28d9"/>
    <rect x="19" y="39" width="10" height="14" rx="2" fill="#7c3aed"/>
    <rect x="19" y="72" width="10" height="14" rx="2" fill="#7c3aed"/>
    <rect x="155" y="39" width="10" height="14" rx="2" fill="#7c3aed"/>
    <rect x="155" y="72" width="10" height="14" rx="2" fill="#7c3aed"/>
    <text x="92" y="126" text-anchor="middle" class="label">视频 1</text>
    <text x="92" y="151" text-anchor="middle" class="detail">抽取 8 帧</text>
  </g>

  <g transform="translate(510,382)">
    <rect width="420" height="104" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
    <text x="210" y="43" text-anchor="middle" class="label">08　最终问题</text>
    <text x="210" y="75" text-anchor="middle" class="detail">“总结两张图片与视频中的变化。”</text>
  </g>
  <path d="M1240 304 C1240 350 1000 356 930 414" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(72,546)">
    <rect width="1296" height="112" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="28" y="34" class="label">进入模型前的逻辑序列</text>
    <rect x="28" y="54" width="150" height="34" rx="7" fill="#dbeafe"/>
    <text x="103" y="77" text-anchor="middle" class="small">文本 token</text>
    <rect x="186" y="54" width="214" height="34" rx="7" fill="#ccfbf1"/>
    <text x="293" y="77" text-anchor="middle" class="small">图片1占位区</text>
    <rect x="408" y="54" width="126" height="34" rx="7" fill="#dbeafe"/>
    <text x="471" y="77" text-anchor="middle" class="small">文本</text>
    <rect x="542" y="54" width="168" height="34" rx="7" fill="#ffedd5"/>
    <text x="626" y="77" text-anchor="middle" class="small">图片2占位区</text>
    <rect x="718" y="54" width="126" height="34" rx="7" fill="#dbeafe"/>
    <text x="781" y="77" text-anchor="middle" class="small">文本</text>
    <rect x="852" y="54" width="222" height="34" rx="7" fill="#ede9fe"/>
    <text x="963" y="77" text-anchor="middle" class="small">视频占位区</text>
    <rect x="1082" y="54" width="186" height="34" rx="7" fill="#dbeafe"/>
    <text x="1175" y="77" text-anchor="middle" class="small">最终问题 token</text>
  </g>
</svg>
