<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .section { font-size: 21px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 600; }
      .small { font-size: 14px; }
      .note { font-size: 15px; fill: #4b5563; }
      .panel { fill: #ffffff; stroke: #6b7280; stroke-width: 2; rx: 12; }
      .s0 { fill: #dbeafe; stroke: #1971c2; stroke-width: 2; }
      .s1 { fill: #fef3c7; stroke: #e67700; stroke-width: 2; }
      .s2 { fill: #dcfce7; stroke: #2b8a3e; stroke-width: 2; }
      .s3 { fill: #f3e8ff; stroke: #862e9c; stroke-width: 2; }
      .stage { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1400" height="930" fill="#f8fafc"/>
  <text x="45" y="43" class="title">一个任务 → 4 个数据段 → 4 个 rank 错峰 Load</text>
  <text x="1355" y="42" text-anchor="end" class="note">蓝：段 0　橙：段 1　绿：段 2　紫：段 3</text>

  <rect x="35" y="68" width="1330" height="175" class="panel"/>
  <text x="60" y="101" class="section">1. 任务中的 16 个分片按原始顺序排列</text>

  <g transform="translate(62,122)">
    <g transform="translate(0,0)"><rect width="75" height="64" rx="7" class="s0"/><text x="37.5" y="25" text-anchor="middle" class="small">位置 0</text><text x="37.5" y="49" text-anchor="middle" class="label">A7</text></g>
    <g transform="translate(80,0)"><rect width="75" height="64" rx="7" class="s1"/><text x="37.5" y="25" text-anchor="middle" class="small">位置 1</text><text x="37.5" y="49" text-anchor="middle" class="label">B2</text></g>
    <g transform="translate(160,0)"><rect width="75" height="64" rx="7" class="s2"/><text x="37.5" y="25" text-anchor="middle" class="small">位置 2</text><text x="37.5" y="49" text-anchor="middle" class="label">C8</text></g>
    <g transform="translate(240,0)"><rect width="75" height="64" rx="7" class="s3"/><text x="37.5" y="25" text-anchor="middle" class="small">位置 3</text><text x="37.5" y="49" text-anchor="middle" class="label">D1</text></g>
    <g transform="translate(320,0)"><rect width="75" height="64" rx="7" class="s0"/><text x="37.5" y="25" text-anchor="middle" class="small">位置 4</text><text x="37.5" y="49" text-anchor="middle" class="label">E5</text></g>
    <g transform="translate(400,0)"><rect width="75" height="64" rx="7" class="s1"/><text x="37.5" y="25" text-anchor="middle" class="small">位置 5</text><text x="37.5" y="49" text-anchor="middle" class="label">F9</text></g>
    <g transform="translate(480,0)"><rect width="75" height="64" rx="7" class="s2"/><text x="37.5" y="25" text-anchor="middle" class="small">位置 6</text><text x="37.5" y="49" text-anchor="middle" class="label">G3</text></g>
    <g transform="translate(560,0)"><rect width="75" height="64" rx="7" class="s3"/><text x="37.5" y="25" text-anchor="middle" class="small">位置 7</text><text x="37.5" y="49" text-anchor="middle" class="label">H6</text></g>
    <g transform="translate(640,0)"><rect width="75" height="64" rx="7" class="s0"/><text x="37.5" y="25" text-anchor="middle" class="small">位置 8</text><text x="37.5" y="49" text-anchor="middle" class="label">I4</text></g>
    <g transform="translate(720,0)"><rect width="75" height="64" rx="7" class="s1"/><text x="37.5" y="25" text-anchor="middle" class="small">位置 9</text><text x="37.5" y="49" text-anchor="middle" class="label">J7</text></g>
    <g transform="translate(800,0)"><rect width="75" height="64" rx="7" class="s2"/><text x="37.5" y="25" text-anchor="middle" class="small">位置 10</text><text x="37.5" y="49" text-anchor="middle" class="label">K0</text></g>
    <g transform="translate(880,0)"><rect width="75" height="64" rx="7" class="s3"/><text x="37.5" y="25" text-anchor="middle" class="small">位置 11</text><text x="37.5" y="49" text-anchor="middle" class="label">L8</text></g>
    <g transform="translate(960,0)"><rect width="75" height="64" rx="7" class="s0"/><text x="37.5" y="25" text-anchor="middle" class="small">位置 12</text><text x="37.5" y="49" text-anchor="middle" class="label">M2</text></g>
    <g transform="translate(1040,0)"><rect width="75" height="64" rx="7" class="s1"/><text x="37.5" y="25" text-anchor="middle" class="small">位置 13</text><text x="37.5" y="49" text-anchor="middle" class="label">N5</text></g>
    <g transform="translate(1120,0)"><rect width="75" height="64" rx="7" class="s2"/><text x="37.5" y="25" text-anchor="middle" class="small">位置 14</text><text x="37.5" y="49" text-anchor="middle" class="label">P1</text></g>
    <g transform="translate(1200,0)"><rect width="75" height="64" rx="7" class="s3"/><text x="37.5" y="25" text-anchor="middle" class="small">位置 15</text><text x="37.5" y="49" text-anchor="middle" class="label">Q9</text></g>
  </g>
  <text x="700" y="224" text-anchor="middle" class="note">目标数据段有可回收 slot 时：preferredSegment = originalIndex % 4</text>

  <rect x="35" y="263" width="1330" height="245" class="panel"/>
  <text x="60" y="298" class="section">2. Dump：分片优先写入不同数据段</text>
  <text x="1340" y="297" text-anchor="end" class="note">各数据段：mbind → memset 触页 → move_pages 验证</text>

  <g transform="translate(65,330)">
    <g><rect width="292" height="142" rx="10" class="s0"/><text x="146" y="31" text-anchor="middle" class="section">Rank 0 数据段</text><text x="146" y="65" text-anchor="middle" class="note">位置 0、4、8、12</text><text x="146" y="96" text-anchor="middle" class="label">A7　E5　I4　M2</text><text x="146" y="125" text-anchor="middle" class="small">指定 NUMA 节点或节点组</text></g>
    <g transform="translate(320,0)"><rect width="292" height="142" rx="10" class="s1"/><text x="146" y="31" text-anchor="middle" class="section">Rank 1 数据段</text><text x="146" y="65" text-anchor="middle" class="note">位置 1、5、9、13</text><text x="146" y="96" text-anchor="middle" class="label">B2　F9　J7　N5</text><text x="146" y="125" text-anchor="middle" class="small">指定 NUMA 节点或节点组</text></g>
    <g transform="translate(640,0)"><rect width="292" height="142" rx="10" class="s2"/><text x="146" y="31" text-anchor="middle" class="section">Rank 2 数据段</text><text x="146" y="65" text-anchor="middle" class="note">位置 2、6、10、14</text><text x="146" y="96" text-anchor="middle" class="label">C8　G3　K0　P1</text><text x="146" y="125" text-anchor="middle" class="small">指定 NUMA 节点或节点组</text></g>
    <g transform="translate(960,0)"><rect width="292" height="142" rx="10" class="s3"/><text x="146" y="31" text-anchor="middle" class="section">Rank 3 数据段</text><text x="146" y="65" text-anchor="middle" class="note">位置 3、7、11、15</text><text x="146" y="96" text-anchor="middle" class="label">D1　H6　L8　Q9</text><text x="146" y="125" text-anchor="middle" class="small">指定 NUMA 节点或节点组</text></g>
  </g>

  <rect x="35" y="528" width="1330" height="360" class="panel"/>
  <text x="60" y="563" class="section">3. LoadQueue：RearrangeIndex 让不同 rank 从不同数据段开始加载</text>
  <text x="1340" y="563" text-anchor="end" class="note">阶段表示逻辑处理顺序，不表示 rank 间同步屏障</text>

  <g transform="translate(62,590)">
    <rect x="135" y="0" width="280" height="42" rx="6" class="stage"/><text x="275" y="27" text-anchor="middle" class="label">阶段 0</text>
    <rect x="425" y="0" width="280" height="42" rx="6" class="stage"/><text x="565" y="27" text-anchor="middle" class="label">阶段 1</text>
    <rect x="715" y="0" width="280" height="42" rx="6" class="stage"/><text x="855" y="27" text-anchor="middle" class="label">阶段 2</text>
    <rect x="1005" y="0" width="280" height="42" rx="6" class="stage"/><text x="1145" y="27" text-anchor="middle" class="label">阶段 3</text>

    <text x="65" y="83" text-anchor="middle" class="section">rank 0</text>
    <rect x="135" y="52" width="280" height="52" rx="7" class="s0"/><text x="275" y="84" text-anchor="middle" class="label">段 0　A7 E5 I4 M2</text>
    <rect x="425" y="52" width="280" height="52" rx="7" class="s1"/><text x="565" y="84" text-anchor="middle" class="label">段 1　B2 F9 J7 N5</text>
    <rect x="715" y="52" width="280" height="52" rx="7" class="s2"/><text x="855" y="84" text-anchor="middle" class="label">段 2　C8 G3 K0 P1</text>
    <rect x="1005" y="52" width="280" height="52" rx="7" class="s3"/><text x="1145" y="84" text-anchor="middle" class="label">段 3　D1 H6 L8 Q9</text>

    <text x="65" y="145" text-anchor="middle" class="section">rank 1</text>
    <rect x="135" y="114" width="280" height="52" rx="7" class="s1"/><text x="275" y="146" text-anchor="middle" class="label">段 1　B2 F9 J7 N5</text>
    <rect x="425" y="114" width="280" height="52" rx="7" class="s2"/><text x="565" y="146" text-anchor="middle" class="label">段 2　C8 G3 K0 P1</text>
    <rect x="715" y="114" width="280" height="52" rx="7" class="s3"/><text x="855" y="146" text-anchor="middle" class="label">段 3　D1 H6 L8 Q9</text>
    <rect x="1005" y="114" width="280" height="52" rx="7" class="s0"/><text x="1145" y="146" text-anchor="middle" class="label">段 0　A7 E5 I4 M2</text>

    <text x="65" y="207" text-anchor="middle" class="section">rank 2</text>
    <rect x="135" y="176" width="280" height="52" rx="7" class="s2"/><text x="275" y="208" text-anchor="middle" class="label">段 2　C8 G3 K0 P1</text>
    <rect x="425" y="176" width="280" height="52" rx="7" class="s3"/><text x="565" y="208" text-anchor="middle" class="label">段 3　D1 H6 L8 Q9</text>
    <rect x="715" y="176" width="280" height="52" rx="7" class="s0"/><text x="855" y="208" text-anchor="middle" class="label">段 0　A7 E5 I4 M2</text>
    <rect x="1005" y="176" width="280" height="52" rx="7" class="s1"/><text x="1145" y="208" text-anchor="middle" class="label">段 1　B2 F9 J7 N5</text>

    <text x="65" y="269" text-anchor="middle" class="section">rank 3</text>
    <rect x="135" y="238" width="280" height="52" rx="7" class="s3"/><text x="275" y="270" text-anchor="middle" class="label">段 3　D1 H6 L8 Q9</text>
    <rect x="425" y="238" width="280" height="52" rx="7" class="s0"/><text x="565" y="270" text-anchor="middle" class="label">段 0　A7 E5 I4 M2</text>
    <rect x="715" y="238" width="280" height="52" rx="7" class="s1"/><text x="855" y="270" text-anchor="middle" class="label">段 1　B2 F9 J7 N5</text>
    <rect x="1005" y="238" width="280" height="52" rx="7" class="s2"/><text x="1145" y="270" text-anchor="middle" class="label">段 2　C8 G3 K0 P1</text>
  </g>

  <text x="700" y="913" text-anchor="middle" class="label">同一阶段，4 个 rank 分别优先读取不同数据段，避免访问集中到同一 NUMA 节点</text>
</svg>
