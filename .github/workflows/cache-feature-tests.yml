name: Cache feature tests

on:
  push:
    branches:
      - codex/cache-first-layer-prefetch
      - codex/cache-rank-partition

permissions:
  contents: read

jobs:
  cache-simu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure simulated runtime
        run: cmake -S . -B build-cache -DCMAKE_BUILD_TYPE=Debug -DBUILD_UNIT_TESTS=ON -DRUNTIME_ENVIRONMENT=simu
      - name: Build store tests
        run: cmake --build build-cache --target ucmstore.test -j4
      - name: Run Cache tests
        run: ctest --test-dir build-cache -R '[Cc]ache' --output-on-failure --timeout 60
